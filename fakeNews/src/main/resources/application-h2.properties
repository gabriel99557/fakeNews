# Perfil "h2": banco em memória para rodar o projeto sem PostgreSQL instalado.
# Ative com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Os dados são perdidos ao reiniciar a aplicação.
spring.datasource.url=jdbc:h2:mem:crivonews;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:crivonews)
spring.h2.console.enabled=true
