spring.application.name=fakeNews

# Corrigido: URL base sem o /v1 no final
spring.ai.openai.base-url=https://api.groq.com/openai
# Chave lida da variável de ambiente GROQ_API_KEY (nunca versionar a chave real)
spring.ai.openai.api-key=${GROQ_API_KEY}
# llama-3.1-8b-instant foi descontinuado na Groq; modelos disponíveis: GET https://api.groq.com/openai/v1/models
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Camada de Persistência (RF03) — PostgreSQL.
# Os valores padrão servem para um PostgreSQL local; sobrescreva com as variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crivonews}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Cria/atualiza a tabela "analises" automaticamente a partir da entidade
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
